[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chitan-watch"
version = "0.1.0"
description = "Deterministic foundation for Chitan Watch"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["crawler"]

[tool.pytest.ini_options]
pythonpath = ["crawler"]
testpaths = ["tests"]
